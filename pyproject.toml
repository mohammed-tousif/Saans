[project]
name = "saans"
version = "0.1.0"
description = "Saans — Your family's cleaner-air day. Urban air quality assistant for Indian households."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "coverage==7.17.5",
    "mypy==2.4.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "BLE001", "C90", "D", "E", "F", "I", "N", "PLR2004", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test expectations can use literal inputs and expected values.
"tests/**/*.py" = ["D", "PLR2004"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
